<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f1ec;
    --ink: #2b2620;
    --accent: #b5533c;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  h1 {
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  p.sub {
    margin: 0 0 20px;
    font-size: 0.9rem;
    color: #6b6155;
    text-align: center;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    aspect-ratio: 4/3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    background: #000;
  }
  .stage img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  .img-after {
    clip-path: inset(0 0 0 50%);
  }
  .divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: white;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .handle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    cursor: ew-resize;
    pointer-events: none;
  }
  .handle svg { width: 20px; height: 20px; }
  .label {
    position: absolute;
    bottom: 10px;
    padding: 4px 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 0.75rem;
    letter-spacing: 1px;
    border-radius: 4px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .label-before { left: 10px; }
  .label-after { right: 10px; }

  input[type=range] {
    width: 100%;
    max-width: 520px;
    margin-top: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover { background: var(--accent); color: white; }
  button.active { background: var(--accent); color: white; }

  .crossfade-stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    aspect-ratio: 4/3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    margin-top: 22px;
    display: none;
  }
  .crossfade-stage.visible { display: block; }
  .crossfade-stage img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .crossfade-stage .fade-after {
    animation: crossfade 5s ease-in-out infinite;
  }
  @keyframes crossfade {
    0%, 40% { opacity: 0; }
    50%, 90% { opacity: 1; }
    100% { opacity: 0; }
  }
  .caption {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--ink);
    animation: captionSwap 5s ease-in-out infinite;
  }
  @keyframes captionSwap {
    0%, 40% { content: "BEFORE"; }
  }
</style>
</head>
<body>

<h1>Medicine Closet — Before &amp; After</h1>

  <button id="btn-fade">Auto Crossfade</button>

<script>
const range = document.getElementById('range');
const afterImg = document.getElementById('after-img');
const divider = document.getElementById('divider');
const handle = document.getElementById('handle');

function update(val) {
  afterImg.style.clipPath = `inset(0 0 0 ${val}%)`;
  divider.style.left = val + '%';
  handle.style.left = val + '%';
}
range.addEventListener('input', e => update(e.target.value));
update(50);

const btnSlider = document.getElementById('btn-slider');
const btnFade = document.getElementById('btn-fade');
const sliderStage = document.getElementById('slider-stage');
const fadeStage = document.getElementById('fade-stage');
const fadeCaption = document.getElementById('fade-caption');

btnSlider.addEventListener('click', () => {
  btnSlider.classList.add('active');
  btnFade.classList.remove('active');
  sliderStage.style.display = 'block';
  range.style.display = 'block';
  fadeStage.classList.remove('visible');
});

btnFade.addEventListener('click', () => {
  btnFade.classList.add('active');
  btnSlider.classList.remove('active');
  sliderStage.style.display = 'none';
  range.style.display = 'none';
  fadeStage.classList.add('visible');
});

setInterval(() => {
  const t = (Date.now() / 5000) % 1;
  fadeCaption.textContent = (t < 0.4 || t > 0.9) ? 'BEFORE' : 'AFTER';
}, 200);
</script>
